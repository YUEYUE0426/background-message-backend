name = "background-message-backend"
main = "src/index.js"
compatibility_date = "2026-10-05"

[durable_objects]
bindings = [
  { name = "BACKGROUND_BACKEND", class_name = "BackgroundBackend" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BackgroundBackend"]

[[queues.producers]]
binding = "AI_QUEUE"
queue = "uwu-ai-jobs"

[[queues.consumers]]
queue = "uwu-ai-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
